<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Humanly">
  <defs>
    <linearGradient id="hl-bar" x1="120" y1="34" x2="120" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8044e0"/>
      <stop offset="1" stop-color="#3f1b73"/>
    </linearGradient>
    <linearGradient id="hl-orange" x1="70" y1="180" x2="170" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f15a1a"/>
      <stop offset="1" stop-color="#fdb44a"/>
    </linearGradient>
    <radialGradient id="hl-dot" cx="0.36" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fec45a"/>
      <stop offset="1" stop-color="#f0631a"/>
    </radialGradient>
    <linearGradient id="hl-swoosh" x1="60" y1="206" x2="180" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a2a9e"/>
      <stop offset="0.5" stop-color="#8b44e8"/>
      <stop offset="1" stop-color="#5a2a9e"/>
    </linearGradient>
    <clipPath id="hl-clip-left"><rect x="66" y="34" width="34" height="152" rx="17"/></clipPath>
    <clipPath id="hl-clip-right"><rect x="140" y="34" width="34" height="152" rx="17"/></clipPath>
  </defs>

  <!-- H stems -->
  <rect x="66" y="34" width="34" height="152" rx="17" fill="url(#hl-bar)"/>
  <rect x="140" y="34" width="34" height="152" rx="17" fill="url(#hl-bar)"/>

  <!-- orange flame accents inside the stems -->
  <g clip-path="url(#hl-clip-left)">
    <path d="M66 186 L100 186 L100 95 C94 112 80 118 66 118 Z" fill="url(#hl-orange)"/>
    <path d="M100 95 C94 112 80 118 66 118" stroke="#fbf7f1" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g clip-path="url(#hl-clip-right)">
    <path d="M174 34 L140 34 L140 125 C146 108 160 102 174 102 Z" fill="url(#hl-orange)"/>
    <path d="M140 125 C146 108 160 102 174 102" stroke="#fbf7f1" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- crossbar tick stubs -->
  <rect x="98" y="107" width="10" height="6" rx="3" fill="#fbf7f1"/>
  <rect x="132" y="107" width="10" height="6" rx="3" fill="#fbf7f1"/>

  <!-- center dot -->
  <circle cx="120" cy="110" r="16" fill="url(#hl-dot)"/>

  <!-- swoosh smile -->
  <path d="M62 198 C94 220 146 220 178 198 C150 212 90 212 62 198 Z" fill="url(#hl-swoosh)"/>
</svg>
